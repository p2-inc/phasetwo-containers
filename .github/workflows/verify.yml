name: 'Verify docker build'

on:
  pull_request:

jobs:
  # Fast, hermetic tests for the Keycloak source-build script — no Docker, no
  # Maven, no network. Runs alongside the image build rather than gating it, so
  # a broken script and a broken image are reported in the same pass.
  test-build-script:
    name: 'Test build-keycloak.sh'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Run test suite
        run: ./scripts/test-build-keycloak.sh

  verify-docker-build:
    name: 'Verify docker build'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Compute short commit SHA
        run: echo "GIT_COMMIT=$(git rev-parse --short=8 HEAD)" >> $GITHUB_ENV

      # Keycloak must be built from source before libs/ or the image can be
      # built: the tags we track are not published to Central or quay. Cached
      # on the CRDB branch head, so only a version bump pays the build cost.
      - name: Build Keycloak from source
        id: keycloak
        uses: ./.github/actions/keycloak-artifacts

      # Build single-arch and load into the local daemon so Trivy can scan
      # the actual layers this PR would produce.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          build-args: |
            GIT_COMMIT=${{ env.GIT_COMMIT }}
          build-contexts: |
            keycloak=${{ steps.keycloak.outputs.context-path }}
          tags: phasetwo-keycloak:pr
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Non-gating Trivy scan — surfaces HIGH/CRITICAL regressions in the PR
      # checks tab without blocking the merge. Branch protection can flip
      # exit-code to '1' to make this a hard gate.
      - name: Trivy — scan PR image (informational)
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          # The action wrapper has no `vex` input; the Trivy CLI reads
          # TRIVY_VEX as the env-var equivalent of `--vex`.
          TRIVY_VEX: openvex.json
        with:
          image-ref: phasetwo-keycloak:pr
          format: table
          severity: HIGH,CRITICAL
          vuln-type: os,library
          exit-code: '0'

      - name: Trivy — scan PR image (JSON for artifact)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_VEX: openvex.json
        with:
          image-ref: phasetwo-keycloak:pr
          format: json
          output: trivy-pr.json
          severity: HIGH,CRITICAL
          vuln-type: os,library
          exit-code: '0'

      - name: Upload Trivy PR report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: trivy-pr-${{ github.event.pull_request.number }}
          path: trivy-pr.json
          retention-days: 14
