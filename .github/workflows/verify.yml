name: 'Verify docker build'

on:
  pull_request:

jobs:
  # Fast, hermetic tests for the Keycloak source-build script — no Docker, no
  # Maven, no network. Runs alongside the image build rather than gating it, so
  # a broken script and a broken image are reported in the same pass.
  test-build-script:
    name: 'Test build-keycloak.sh'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Run test suite
        run: ./scripts/test-build-keycloak.sh

  verify-docker-build:
    name: 'Verify docker build'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Compute short commit SHA
        run: echo "GIT_COMMIT=$(git rev-parse --short=8 HEAD)" >> $GITHUB_ENV

      # Every Keycloak port lands here as a version bump whose extension
      # releases have not been published yet, and the resulting failure is a
      # Maven dependency error ~8 minutes in, buried in buildx output. Check it
      # up front instead: same gate, named artifacts, two seconds.
      - name: Check extension releases are published
        run: |
          python3 - <<'EOF'
          import re, sys, urllib.request, xml.etree.ElementTree as ET

          NS = {'m': 'http://maven.apache.org/POM/4.0.0'}
          props = ET.parse('libs/pom.xml').getroot().find('m:properties', NS)
          props = {re.sub(r'\{.*\}', '', e.tag): (e.text or '').strip() for e in props}

          missing, snapshots = [], []
          for dep in ET.parse('libs/bundle/pom.xml').getroot().iter(
                  '{http://maven.apache.org/POM/4.0.0}dependency'):
              g = dep.findtext('m:groupId', '', NS)
              a = dep.findtext('m:artifactId', '', NS)
              v = dep.findtext('m:version', '', NS)
              if not g.startswith('io.phasetwo'):
                  continue
              m = re.fullmatch(r'\$\{(.+)\}', v)
              v = props.get(m.group(1), v) if m else v
              if v.endswith('SNAPSHOT'):
                  # Fine locally (the host-m2 build context supplies them), but
                  # a SNAPSHOT must never reach a merged image build.
                  print('  SNAPSHOT %s:%s:%s' % (g, a, v))
                  snapshots.append('%s:%s:%s' % (g, a, v))
                  continue
              if '${' in v:
                  continue
              url = ('https://repo1.maven.org/maven2/%s/%s/%s/%s-%s.pom'
                     % (g.replace('.', '/'), a, v, a, v))
              try:
                  urllib.request.urlopen(url, timeout=30).close()
                  print('  ok       %s:%s:%s' % (g, a, v))
              except Exception:
                  print('  MISSING  %s:%s:%s' % (g, a, v))
                  missing.append('%s:%s:%s' % (g, a, v))

          if snapshots:
              print('\n::error::SNAPSHOT versions committed: '
                    + ', '.join(snapshots))
              print('Pin released versions before merging. SNAPSHOTs are for '
                    'local builds via --build-context host-m2=$HOME/.m2.')

          if missing:
              print('\n::error::Not yet on Maven Central: ' + ', '.join(missing))
              print('The extension PRs for this bump must merge and release '
                    'before this one can build. Nothing to fix here -- re-run '
                    'once the releases are published.')

          if missing or snapshots:
              sys.exit(1)
          EOF

      # Keycloak must be built from source before libs/ or the image can be
      # built: the tags we track are not published to Central or quay. Cached
      # on the CRDB branch head, so only a version bump pays the build cost.
      - name: Build Keycloak from source
        id: keycloak
        uses: ./.github/actions/keycloak-artifacts

      # Build single-arch and load into the local daemon so Trivy can scan
      # the actual layers this PR would produce.
      - name: Build image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          build-args: |
            GIT_COMMIT=${{ env.GIT_COMMIT }}
          build-contexts: |
            keycloak=${{ steps.keycloak.outputs.context-path }}
          tags: phasetwo-keycloak:pr
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Ask the server it just built which Keycloak it is, and hold that against
      # libs/pom.xml. Everything upstream of here derives from the pom — the fork
      # branch to build, the artifacts libs/ compiles against, the published tags —
      # so a build that succeeds is not evidence that the version actually moved.
      # README.md records what that costs: a 26.8.0 image published as 26.6.7,
      # overwriting the rolling tags for a minor it was not.
      - name: Verify the image reports the Keycloak version libs/pom.xml pins
        run: |
          expected=$(sed -n 's|.*<keycloak\.version>\(.*\)</keycloak\.version>.*|\1|p' libs/pom.xml | head -1)
          if [ -z "$expected" ]; then
            echo "::error file=libs/pom.xml::could not read <keycloak.version>"
            exit 1
          fi
          output=$(docker run --rm phasetwo-keycloak:pr --version 2>&1) || {
            echo "::error::'kc.sh --version' failed in the built image"
            printf '%s\n' "$output"
            exit 1
          }
          printf '%s\n' "$output"
          reported=$(printf '%s\n' "$output" | sed -n 's/^Keycloak \([0-9][^[:space:]]*\).*/\1/p' | head -1)
          if [ -z "$reported" ]; then
            echo "::error::could not parse a Keycloak version out of 'kc.sh --version'"
            exit 1
          fi
          if [ "$reported" != "$expected" ]; then
            echo "::error file=libs/pom.xml::image reports Keycloak $reported but libs/pom.xml pins $expected"
            exit 1
          fi
          echo "image reports Keycloak $reported, matching libs/pom.xml"

      # Non-gating Trivy scan — surfaces HIGH/CRITICAL regressions in the PR
      # checks tab without blocking the merge. Branch protection can flip
      # exit-code to '1' to make this a hard gate.
      - name: Trivy — scan PR image (informational)
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          # The action wrapper has no `vex` input; the Trivy CLI reads
          # TRIVY_VEX as the env-var equivalent of `--vex`.
          TRIVY_VEX: openvex.json
        with:
          image-ref: phasetwo-keycloak:pr
          format: table
          severity: HIGH,CRITICAL
          vuln-type: os,library
          exit-code: '0'

      - name: Trivy — scan PR image (JSON for artifact)
        if: steps.build.outcome == 'success'
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_VEX: openvex.json
        with:
          image-ref: phasetwo-keycloak:pr
          format: json
          output: trivy-pr.json
          severity: HIGH,CRITICAL
          vuln-type: os,library
          exit-code: '0'

      - name: Upload Trivy PR report
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: trivy-pr-${{ github.event.pull_request.number }}
          path: trivy-pr.json
          retention-days: 14
